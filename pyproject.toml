[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "embers-diaries"
version = "0.2.0"
description = "Ember's Diaries: A cognitive database engine for AI memory systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ticket", email = "ticketguy@gmail.com"}]

dependencies = [
    "msgpack>=1.0.8,<2.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
experimental = ["tiktoken>=0.7,<1", "fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
vector = [
    "numpy>=1.26.0,<3.0.0",
]
fulltext = [
    "whoosh>=2.7.4",
]
api = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.29.0,<1.0.0",
]
all = [
    "msgpack>=1.0.8,<2.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "numpy>=1.26.0,<3.0.0",
    "whoosh>=2.7.4",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.29.0,<1.0.0",
]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
ember-mcp = "embers.mcp.server:main"
ember-api = "embers.api_cli:main"

[tool.maturin]
manifest-path = "rust/ember_core/Cargo.toml"
python-source = "."
python-packages = ["embers"]
module-name = "embers._native"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
