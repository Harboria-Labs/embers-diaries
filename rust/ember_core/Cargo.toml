[package]
name = "ember_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
pyo3 = { version = "0.24", features = ["extension-module"] }
rmpv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"

