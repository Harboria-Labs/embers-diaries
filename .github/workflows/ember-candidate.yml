name: Ember candidate validation
on:
  pull_request:
  push:
    branches:
      - codex/ember-split-feedback-candidate04
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Rust toolchain
        run: rustc --version && cargo --version
      - name: Build native engine and install test dependencies
        run: python -m pip install -e ".[dev,all]" httpx
      - name: Require native engine
        run: python -c "from embers import _native; print(_native.__file__)"
      - name: Feedback and replay regressions
        run: python -m pytest -q tests/test_split_feedback.py tests/test_feedback_replay.py tests/test_feedback_lifecycle.py
      - name: Full regression suite
        run: python -m pytest -q
      - name: Rust type and build checks
        run: cargo check --manifest-path rust/ember_core/Cargo.toml
